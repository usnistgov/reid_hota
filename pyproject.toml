[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reid_hota"
dynamic = ["version"]
authors = [
  { name="Michael Majurski", email="michael.majurski@nist.gov" },
]
description = "Modified HOTA (Higher Order Tracking Accuracy) extended for ReID evaluation"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "pyproj>=3.6",
    "scipy>=1.15.3",
]

[tool.hatch.version]
path = "src/reid_hota/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reid_hota"]
exclude = [
    "tests/",
    "examples/",
    "*.pyc",
    "__pycache__/",
    "*.egg-info/",
    ".git/",
    ".gitignore",
    "*.md",
    "*.txt",
    "*.json",
    "*.csv",
    "*.mp4",
    "*.parquet",
    "*.krtd"
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "examples/",
    "*.pyc",
    "__pycache__/",
    "*.egg-info/",
    ".git/",
    ".gitignore",
    "*.json",
    "*.csv",
    "*.mp4",
    "*.parquet",
    "*.krtd"
]

[tool.pytest.ini_options]
addopts = ["-s"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["examples", "tmp*.py"]

[tool.ruff.lint]
# Conservative set: real-bug catches (pyflakes) + import hygiene + a handful of
# pycodestyle warnings. Style-only rules (line length, naming) are off so
# library code can keep its current conventions.
select = ["F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # pandas/numpy idioms call functions as defaults sometimes
    "B007",  # loop var unused — harmless in many enumerate cases
    "UP015", # don't force open() to drop redundant mode
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # tests may bind intermediates for clarity even if unused

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/usnistgov/reid_hota"